[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-sgp4"
version = "0.1.0"
description = "The SGP4 orbit propagator from the Python sgp4 package, in Mojo"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.urls]
Homepage = "https://github.com/leepenkman/mojo-sgp4"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
# The compiled kernel travels with the package, so an installed wheel does
# not need a Mojo toolchain to import.
mojosgp4 = ["libmojo-sgp4.so"]

[tool.pytest.ini_options]
testpaths = ["tests"]
