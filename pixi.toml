[workspace]
authors = ["Lee Penkman <leepenkman@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mojo-sgp4"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = "bash build/build.sh"
test = "python -m pytest tests -q"
bench = "flock /tmp/mojo-bench.lock python bench/bench.py"

[activation.env]
PYTHONPATH = "python"
# numpy only carries buffers across the FFI here, never a BLAS call, and its
# 72-thread pool aborts the process with "pthread_create failed" on hosts with
# a tight pid limit.
OPENBLAS_NUM_THREADS = "1"

[dependencies]
mojo = "==1.2.0.dev2026092605"
python = "3.13.*"
max = "==26.7.0.dev2026092605"
sgp4 = "*"
pytest = "*"
numpy = "*"
